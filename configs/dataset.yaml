project:
  name: GeoAI-UrbanTree-RFDETR

dataset:
  name: new_york_030
  split_name: test

input:
  raster_dir: datasets/geotiff_rgbn/new_york_030
  raster_pattern: "*.tif"

  labels: datasets/labels/new_york_030/labels_new_york_030.shp

processing:
  tile_size: 256

  bands:
    - 1
    - 2
    - 3

  min_bbox_area: 4.0

  skip_empty: false
  keep_partial: false

output:
  root: outputs/dataset_preparation/new_york_030

  # If true, remove the existing output directory before running.
  clean: false

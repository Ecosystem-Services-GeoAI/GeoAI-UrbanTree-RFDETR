project:
  name: GeoAI-UrbanTree-RFDETR
  inference_name: miami_full_aoi

model:
  architecture: RFDETRBase

checkpoint:
  path: weights/tvt/checkpoint_best_ema.pth

input:
  raster: datasets/geotiff_rgbn/miami_030/NAIP_2023_Miami_RGBN_CLIP.tif

  # RGB channels from the RGBN GeoTIFF
  bands:
    - 1
    - 2
    - 3

inference:
  tile_size: 256
  confidence_threshold: 0.30
  max_detections: 200

  # Full-area inference by default
  test_mode: false

  # Used only when test_mode is true
  max_test_tiles: 100
  save_test_tiles: false

output:
  root: outputs/inference/miami_030/full_aoi

  save_json: true
  save_geojson: true
  save_shapefile: true
